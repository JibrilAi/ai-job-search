name = "ai-job-search-worker"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Setup (one-time, per Cloudflare account):
#   wrangler d1 create ai_job_search_db          -> paste database_id below
#   wrangler kv namespace create AUTH_KV         -> paste id below
#   wrangler r2 bucket create ai-job-search-documents
#   wrangler queues create scrape-portal-queue
#   wrangler queues create rank-job-queue
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put SESSION_SECRET
#   wrangler secret put MAGIC_LINK_SECRET
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put TURNSTILE_SECRET_KEY
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "ai_job_search_db"
database_id = "6aa3960c-aad9-4ba6-a43a-00fc97675ecf"
migrations_dir = "../migrations"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "938fc2614e314a289912870735115db4"

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "ai-job-search-documents"

[browser]
binding = "BROWSER"

[[queues.producers]]
binding = "SCRAPE_QUEUE"
queue = "scrape-portal-queue"

[[queues.producers]]
binding = "RANK_QUEUE"
queue = "rank-job-queue"

[[queues.consumers]]
queue = "scrape-portal-queue"
max_batch_size = 5
max_retries = 3

[[queues.consumers]]
queue = "rank-job-queue"
max_batch_size = 10
max_retries = 3

# Scrapes every 6 hours. Cron Triggers take no arguments -- the handler reads
# `scrape_queries` (D1) and fans work out onto SCRAPE_QUEUE.
[triggers]
crons = ["0 */6 * * *"]

[vars]
ENVIRONMENT = "production"
# Comma-separated list of origins allowed to call this API -- the Worker's
# CORS check (src/index.ts) rejects any request from an origin not in this
# list. Include every domain the frontend is actually served from (the
# *.pages.dev URL and any custom domain(s) pointed at the Pages project).
# Adding a domain later (e.g. a new custom domain) means updating this list
# and redeploying the Worker -- a domain missing here fails silently in the
# browser as a CORS error, which the frontend can only show as a generic
# "Something went wrong" (see client.ts's request()).
FRONTEND_ORIGIN = "https://inhr.ca,https://www.inhr.ca,https://ai-job-search-2hg.pages.dev"

# The single canonical frontend URL used to build links inside emails
# (magic link, welcome email). Deliberately separate from FRONTEND_ORIGIN
# above (which can list multiple CORS-allowed origins) -- do NOT put a
# comma-separated list here, it goes straight into an href.
APP_ORIGIN = "https://inhr.ca"

# The "Name <local@yourdomain>" sender address for magic-link and welcome
# emails. Must be on a domain verified in the Resend account that owns
# RESEND_API_KEY (Resend rejects sends from unverified domains) -- inhr.ca
# is verified, so this works as-is. Without this var, sends fall back to
# Resend's shared sandbox sender, which Resend restricts to only the
# account's own address -- any send to a real user then fails with a 403
# ("You can only send testing emails to your own email address") and never
# reaches its recipient.
RESEND_FROM_EMAIL = "AI Job Search <hello@inhr.ca>"

# Secrets (set via `wrangler secret put <NAME>`, never committed here):
#   GEMINI_API_KEY, SESSION_SECRET, MAGIC_LINK_SECRET, RESEND_API_KEY,
#   TURNSTILE_SECRET_KEY
#
# TURNSTILE_SECRET_KEY pairs with the frontend's VITE_TURNSTILE_SITE_KEY
# (create a Turnstile widget at dash.cloudflare.com -> Turnstile). Without it,
# signup/login/magic-link skip bot verification -- fine for dev, not for prod.
#
# To make the first admin: sign up normally, then run
#   wrangler d1 execute ai_job_search_db --remote \
#     --command "UPDATE users SET role='admin' WHERE email='you@example.com'"
