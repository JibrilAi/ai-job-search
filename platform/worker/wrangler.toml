name = "ai-job-search-worker"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Setup (one-time, per Cloudflare account):
#   wrangler d1 create ai_job_search_db          -> paste database_id below
#   wrangler kv namespace create AUTH_KV         -> paste id below
#   wrangler r2 bucket create ai-job-search-documents
#   wrangler queues create scrape-portal-queue
#   wrangler queues create rank-job-queue
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put SESSION_SECRET
#   wrangler secret put MAGIC_LINK_SECRET
#   wrangler secret put RESEND_API_KEY
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "DB"
database_name = "ai_job_search_db"
database_id = "6aa3960c-aad9-4ba6-a43a-00fc97675ecf"
migrations_dir = "../migrations"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "938fc2614e314a289912870735115db4"

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "ai-job-search-documents"

[browser]
binding = "BROWSER"

[[queues.producers]]
binding = "SCRAPE_QUEUE"
queue = "scrape-portal-queue"

[[queues.producers]]
binding = "RANK_QUEUE"
queue = "rank-job-queue"

[[queues.consumers]]
queue = "scrape-portal-queue"
max_batch_size = 5
max_retries = 3

[[queues.consumers]]
queue = "rank-job-queue"
max_batch_size = 10
max_retries = 3

# Scrapes every 6 hours. Cron Triggers take no arguments -- the handler reads
# `scrape_queries` (D1) and fans work out onto SCRAPE_QUEUE.
[triggers]
crons = ["0 */6 * * *"]

[vars]
ENVIRONMENT = "production"
# Set to the deployed Pages URL -- the Worker's CORS check rejects requests
# from any other origin. If the Pages project's URL changes (e.g. a custom
# domain is added later), update this and redeploy the Worker.
FRONTEND_ORIGIN = "https://ai-job-search-2hg.pages.dev"

# Secrets (set via `wrangler secret put <NAME>`, never committed here):
#   ANTHROPIC_API_KEY, SESSION_SECRET, MAGIC_LINK_SECRET, RESEND_API_KEY
#
# RESEND_FROM_EMAIL (optional [vars] entry, not a secret): the "Name <local@
# yourdomain>" sender address for magic-link emails. Must be on a domain
# verified in the Resend account that owns RESEND_API_KEY -- Resend rejects
# sends from unverified domains. Without it, sends fall back to Resend's
# shared sandbox sender, which only delivers to the account's own address.
