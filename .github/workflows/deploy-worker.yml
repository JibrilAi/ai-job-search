name: Deploy platform Worker

# Manually-triggered deploy of platform/worker to Cloudflare, run from
# GitHub's own runners (which have real internet access to the Cloudflare
# API, unlike a sandboxed dev environment). Requires a CLOUDFLARE_API_TOKEN
# repository secret (Settings -> Secrets and variables -> Actions -> New
# repository secret) with Workers Scripts:Edit permission at minimum.
#
# D1/KV/R2 resources, the D1 schema, and the ANTHROPIC_API_KEY/
# SESSION_SECRET/MAGIC_LINK_SECRET Worker secrets are provisioned
# separately (see platform/worker/wrangler.toml's setup comment and
# platform/README.md) -- this workflow only pushes the Worker script itself.
on:
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "platform/worker/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
